[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
upload_port = auto   ; finds Teensy automatically
lib_deps = 
    https://github.com/tsandmann/freertos-teensy.git
build_flags = 
    -D USB_SERIAL
    -D __IMXRT1062__
    -mfpu=fpv5-sp-d16 -mfloat-abi=hard