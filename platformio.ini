[platformio]
default_envs = guidance

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 2000000
upload_protocol = teensy-cli
upload_port = auto
board_build.usbtype = SERIAL
lib_deps = 
    https://github.com/tsandmann/freertos-teensy.git
build_flags = 
    -D USB_SERIAL
    -D __IMXRT1062__
    -mfpu=fpv5-sp-d16 -mfloat-abi=hard

; Full flight code (default)
[env:guidance]
build_src_filter = 
    +<main/guidance.cpp>
    -<test/>

; Isolated blink test
[env:test_blink]
build_src_filter = 
    +<test/blink.cpp>
    -<main/>

; Test Serial1 communication
[env:test_serial]
build_src_filter = 
    +<test/serial.cpp>
    -<main/>

; Test connection serial ping-pong
[env:test_connect]
build_src_filter = 
    +<test/connect.cpp>
    -<main/>
